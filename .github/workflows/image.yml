name: Build image (pod runtime)

# Builds the code-server image that appstore.yaml refers to, by digest. After
# a build, copy the digest from the job summary into appstore.yaml and tag a
# new version: the AppStore only deploys images pinned by digest.
on:
  push:
    branches: [main, 'feat/pod-runtime']
    paths: ['image/**', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dhbw-appstore-t3/apps/online-ide

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: image
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        run: |
          echo "### Image digest" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"

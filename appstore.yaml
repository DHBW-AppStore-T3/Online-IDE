# App contract v2: this app runs as pods, not as VMs (the VM versions, v1.x, are only available via their git
# tags). One code-server per person.
apiVersion: appstore/v2
name: online-ide
runtime: kubernetes
scope: user
workload:
  containers:
    - name: ide
      # Built by .github/workflows/ci.yml. After changing image/, copy the new digest here.
      image: ghcr.io/dhbw-appstore-t3/apps/online-ide@sha256:d9e901b5da038915e7c8e3009b39741da3c9aea4adef32c9ff9ee0b7444b8679
      expose: { port: 8080, path: / }
      # An idle code-server needs ~50 MiB and a few millicores: reserve little, allow bursts. The limits leave room for
      # what students run in the terminal (gcc, npm install, pip builds).
      resources: { cpu: "2", memory: 2Gi, requests: { cpu: 100m, memory: 256Mi } }
      env:
        - { name: PASSWORD, from: generated-password }
      writablePaths: [/tmp]
  storage: { size: 5Gi, mountPath: /home/coder }
# What the workspace may reach (the contract: app-registry README, "network"). pip, npm, git, curl and the code-server
# extension marketplace need the internet, so it starts on; a teacher can switch it off (an exam). Students' own TCP/UDP
# servers and clients between the workspaces of one deployment: a choice, off by default.
network:
  internet: { allowed: true, default: true }
  podNetwork: { allowed: true, default: false }
variables:
  # Optional assignments per team (a ZIP, e.g. aufgaben.zip in this repository): unpacked into ~/Coding-Aufgabe
  # of every member at the first start of their workspace (image/start.sh). Without it the workspace starts empty.
  - { name: assignments, type: file, scope: team, ext: [zip], maxSize: 1Mi, mountPath: /opt/online-ide/assignment.zip }
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
  - { type: password, from: generated-password, username: "{user}" }
